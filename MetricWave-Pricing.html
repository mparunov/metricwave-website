<script>
  (function() {
    var saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'mw-theme') {
      var t = e.data.theme || 'light';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
    }
  });

  function fit() {
    var stage = document.getElementById('fit-stage');
    var wrap  = document.getElementById('fit-wrap');
    if (!stage || !wrap) return;
    var s = Math.min(1, wrap.clientWidth / 1920);
    stage.style.transform = 'scale(' + s + ')';
    var h = stage.scrollHeight * s;
    wrap.style.minHeight = '0';
    wrap.style.height = h + 'px';
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'mw-page-height', height: h }, '*');
    }
  }
  window.addEventListener('load',   function() { fit(); setTimeout(fit, 100); setTimeout(fit, 800); });
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) {
    window.addEventListener('load', function() {
      var stage = document.getElementById('fit-stage');
      if (stage) new ResizeObserver(fit).observe(stage);
    });
  }
</script>

function useTheme() {
  const initial = (typeof document !== "undefined" &&
    document.documentElement.getAttribute("data-theme") || localStorage.getItem("theme") || "light");
  const [mode, setMode] = useState(initial);
  useEffect(() => {
    const obs = new MutationObserver(() => {
      const next = document.documentElement.getAttribute("data-theme") || localStorage.getItem("theme") || "light";
      setMode(next);
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    return () => obs.disconnect();
  }, []);
  return mode;
}

function useLang() {
  const initial = (typeof localStorage !== "undefined" && localStorage.getItem('language')) || 'en';
  const [lang, setLang] = useState(initial);
  useEffect(() => {
    const handler = (e) => { if (e.data && e.data.type === 'mw-lang') setLang(e.data.lang); };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);
  return lang;
}

function MatrixCell({ v, t, accent }) {
  if (v === true)  return <span style={{ color: accent ? t.teal : t.text1, fontWeight: 800, fontSize: 18 }}>✓</span>;
  if (v === false) return <span style={{ color: t.text2, opacity: 0.4 }}>—</span>;
  return <span style={{ fontSize: 13, color: t.text1, lineHeight: 1.4 }}>{v}</span>;
}

function ComparisonMatrix({ t, T }) {
  const M = T ? T.matrix : null;
  const rows = M ? M.rows : MATRIX;
  const colHeaders = T
    ? [PRICING_T[T._lang] || PRICING_T.en, null, null].map((_, i) => {
        const tierNames = ["PILOT","ENGAGEMENT","PARTNERSHIP"];
        return tierNames[i];
      })
    : ["PILOT","ENGAGEMENT","PARTNERSHIP"];
  return (
    <div style={{ position: "relative", padding: "0 80px", marginTop: 100 }}>
      <PageEyebrow color={t.teal}>{M ? M.eyebrow : "· COMPARE · ENGAGEMENT MATRIX ·"}</PageEyebrow>

        letterSpacing: "-0.025em", color: t.text1, lineHeight: 1.05,
      }}>{M ? M.h2 : "Pick the shape that fits your moment."}</h2>
      <div style={{ border: `1.5px solid ${t.border}`, borderRadius: 14, overflow: "hidden" }}>
        <div style={{
          display: "grid", gridTemplateColumns: "1.4fr 1fr 1.05fr 1fr",
          background: t.surface1, borderBottom: `1.5px solid ${t.border}`,
          fontFamily: "'Courier New', monospace", fontSize: 11, fontWeight: 800,
          color: t.text1, letterSpacing: "0.15em",
        }}>
          <div style={{ padding: "20px 28px" }}>{M ? M.feature : "FEATURE"}</div>
          {colHeaders.map((h, i) => (
            <div key={h} style={{
              padding: "20px 24px", color: i === 1 ? t.teal : t.text1,
              borderLeft: `1px solid ${t.border}`,
            }}>
              <span>{h}</span>
              {i === 1 && <span style={{
                marginLeft: 8, fontSize: 9, padding: "2px 7px", borderRadius: 999,

              padding: "18px 28px",
              fontFamily: "'Courier New', monospace", fontSize: 11, fontWeight: 700,
              color: t.text2, letterSpacing: "0.13em", display: "flex", alignItems: "center",

            <div style={{ padding: "18px 24px", borderLeft: `1px solid ${t.border}`, display: "flex", alignItems: "center" }}>

    </div>
  );
}

  const annual  = monthly * 12;

  return (
    <div style={{ position: "relative", padding: "0 80px", marginTop: 100 }}>
      <div style={{
        position: "relative", background: "transparent",
        border: `1.5px solid ${t.border}`, borderRadius: 16, padding: "44px 56px",
        display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 56, alignItems: "center",
      }}>
        <div>
          <PageEyebrow color={t.teal}>{R ? R.eyebrow : "· VALUE CHECK · DECISION HOURS ·"}</PageEyebrow>
          <h3 style={{
            margin: 0, marginBottom: 18, fontWeight: 900, fontSize: 40,

          <p style={{ margin: 0, fontSize: 15, lineHeight: 1.6, color: t.text2, maxWidth: 540 }}>
            {R ? R.lead : "Most teams we work with spend 15–25 hours/week reconciling spreadsheets and pulling reports. Plug your numbers in — the cost rarely surprises us, but it usually surprises everyone else."}
          </p>
        </div>
        <div style={{ display: "grid", gap: 20 }}>
          {[
            { label: R ? R.slider1 : "HOURS / WEEK ON DATA WRANGLING", val: hours, setVal: setHours, min: 0,  max: 60,  unit: R ? R.hrUnit : " HRS" },
            { label: R ? R.slider2 : "BLENDED HOURLY RATE",            val: rate,  setVal: setRate,  min: 30, max: 200, unit: R ? R.hrUnit2 : " / HR", prefix: R ? R.hrPrefix : "$" },
          ].map(({ label, val, setVal, min, max, unit, prefix = "" }) => (
            <div key={label}>
              <div style={{
                display: "flex", justifyContent: "space-between",
                fontFamily: "'Courier New', monospace", fontSize: 11, fontWeight: 700,
                color: t.text2, letterSpacing: "0.12em", marginBottom: 8,
              }}>
                <span>{label}</span>
                <span style={{ color: t.teal }}>{prefix}{val}{unit}</span>
              </div>
              <input type="range" min={min} max={max} value={val}
                onChange={(e) => setVal(+e.target.value)}
                style={{ width: "100%", accentColor: t.teal }} />
            </div>
          ))}
          <div style={{
            marginTop: 8, padding: "20px 22px",
            background: "transparent", border: `1.5px solid ${t.teal}`, borderRadius: 10,
            display: "flex", alignItems: "center", justifyContent: "space-between",

            <div>
              <div style={{ fontFamily: "'Courier New', monospace", fontSize: 10, fontWeight: 700, color: t.text2, letterSpacing: "0.15em", marginBottom: 4 }}>{R ? R.annualLabel : "HIDDEN ANNUAL COST"}</div>
              <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 900, fontSize: 36, letterSpacing: "-0.03em", color: t.teal, lineHeight: 1 }}>${annual.toLocaleString()}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: "'Courier New', monospace", fontSize: 10, fontWeight: 700, color: t.text2, letterSpacing: "0.15em", marginBottom: 4 }}>{R ? R.monthLabel : "PER MONTH"}</div>

            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
