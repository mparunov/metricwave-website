  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  #fit-stage { position: absolute; width: 1920px; height: 800px; transform-origin: top left; top: 0; left: 0; }
  #fit-wrap  { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  @keyframes mwDraw     { to { stroke-dashoffset: 0; } }
  @keyframes mwPulse    { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:0.45; transform: scale(0.92); } }
  @keyframes mwPulseRing{ 0% { opacity:0.6; r:5; } 100% { opacity:0; r:18; } }
  @keyframes mwBar      { from { transform: scaleY(0.3); } to { transform: scaleY(1.05); } }
  @keyframes mwSpin     { to { transform: rotate(360deg); } }
  @keyframes mwFadeIn   { from { opacity:0; } to { opacity:1; } }
  @keyframes mwSlideIn  { from { opacity:0; transform: translateX(-30px); } to { opacity:1; transform: translateX(0); } }
  @keyframes mwSlideInR { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }
  @keyframes mwSlideUp  { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  @keyframes mwGrow     { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes mwScaleX   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes mwPop      { from { opacity:0; transform: scale(0.6); } to { opacity:1; transform: scale(1); } }
  @keyframes mwDashFlow { to { stroke-dashoffset: -100; } }
  @keyframes mwBlink    { 50% { opacity: 0; } }

<script>
  function fit() {
    var stage = document.getElementById('fit-stage');
    var wrap  = document.getElementById('fit-wrap');
    if (!stage || !wrap) return;
    var s = wrap.clientWidth / 1920;
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = '0px';
    stage.style.top  = '0px';
  }
  window.addEventListener('load',   fit);
  window.addEventListener('resize', fit);
</script>

<script type="text/babel" data-presets="env,react">
/* === HERO SHELL === */
const { useState, useEffect } = React;

const HERO_TOKENS = {
  dark: {
    bg:        "#0A0A0A",
    surface1:  "#1A1A1A",
    surface2:  "#2A2A2A",
    border:    "#3A3A3A",
    text1:     "#FFFFFF",
    text2:     "#E5E5E5",
    teal:      "#2DD4BF",
    tealDk:    "#14B8A6",
    tealLt:    "#5EEAD4",
    tealGlow:  "rgba(45,212,191,0.15)",
    warn:      "#F59E0B",
    warnGlow:  "rgba(245,158,11,0.18)",
    ok:        "#22C55E",
    nodeFill:  "#1A1A1A",
    modelFill: "#1A1A1A",
    modelInk:  "#FFFFFF",
    accentBg:  "#2DD4BF",
    accentInk: "#0A0A0A",
  },
  light: {
    bg:        "#FFFFFF",
    surface1:  "#F4F4F6",
    surface2:  "#E8E8EC",
    border:    "#C8C8D4",
    text1:     "#0D0D10",
    text2:     "#404050",
    teal:      "#0D9488",
    tealDk:    "#0F766E",
    tealLt:    "#14B8A6",
    tealGlow:  "rgba(13,148,136,0.12)",
    warn:      "#D97706",
    warnGlow:  "rgba(217,119,6,0.18)",
    ok:        "#16A34A",
    nodeFill:  "#FFFFFF",
    modelFill: "#0D0D10",
    modelInk:  "#FFFFFF",
    accentBg:  "#0D9488",
    accentInk: "#FFFFFF",
  },
};

function useTheme() {
  const getTheme = () => {
    if (typeof document === "undefined") return "light";
    return document.documentElement.getAttribute("data-theme") || "light";
  };
  const [mode, setMode] = useState(getTheme);
  useEffect(() => {
    const obs = new MutationObserver(() => setMode(getTheme()));
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    // Also sync when parent page changes localStorage (same-origin iframe receives storage events)
    const onStorage = (e) => {
      if (e.key === "theme") {
        const next = e.newValue || "light";
        document.documentElement.setAttribute("data-theme", next);
        setMode(next);
      }
    };
    window.addEventListener("storage", onStorage);
    return () => { obs.disconnect(); window.removeEventListener("storage", onStorage); };
  }, []);
  return mode;
}

function HeroLogo({ color, mode }) {
  return (
    <div style={{ display: "inline-flex", alignItems: "center", gap: 10 }}>

}

          {headline.pre}
          {headline.italic && (
            <>{" "}<span style={{ color: t.teal }}>{headline.italic}</span></>
          )}
          {headline.post && <>{" "}{headline.post}</>}
        </h1>

        <p style={{
          fontSize: "1.05rem", lineHeight: 1.6,
          color: t.text2, marginTop: 26, marginBottom: 0,
          maxWidth: 460, textWrap: "pretty", fontWeight: 400,
        }}>{lead}</p>

        <div style={{ display: "flex", gap: 14, marginTop: 36 }}>
          <button style={{
            fontFamily: "inherit", fontSize: 17, fontWeight: 700,
            padding: "16px 44px", borderRadius: 9, cursor: "pointer", whiteSpace: "nowrap",
            border: "none", background: t.teal, color: t.bg,
            letterSpacing: "-0.01em",
          }} onClick={() => window.top.location.href = 'contact.html'}>{ctaPrimary} →</button>
          <button style={{
            fontFamily: "inherit", fontSize: 17, fontWeight: 700,

          }}>{ctaSecondary}</button>
        </div>
      </div>

      {/* RIGHT COLUMN — schematic */}
      <div style={{
        position: "absolute", left: 620, top: 10, width: 1220, height: 730, zIndex: 2,
      }}>
        {Schematic && <Schematic t={t} mode={mode} />}
      </div>

      {/* TICKER strip */}
      <div style={{
        position: "absolute", left: 0, right: 0, bottom: 0, height: 30,
        zIndex: 5,
        background: t.surface1, borderTop: `1px solid ${t.border}`,
        display: "flex", alignItems: "center",
        padding: "0 80px", justifyContent: "space-between",
        fontFamily: "'Courier New', monospace",
        fontSize: "0.65rem", color: t.teal, letterSpacing: "0.12em", textTransform: "uppercase",
      }}>
        <span>{ticker}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>

            width: 6, height: 6, borderRadius: 999,

      </div>
    </div>

}

Object.assign(window, { ServiceHero, HERO_TOKENS, useTheme });

</script>
<script type="text/babel" data-presets="env,react">
/* === HERO PARTS === */
const { useState, useEffect } = React;

/* ============================================================
   Shared schematic primitives — used by every service hero.
   Right-column canvas: 1220 × 560 (svg viewBox 0 0 1220 560)
============================================================ */

function NodeCard({
  x, y, w = 200, h = 56, label, sub,
  t, accent = false, status = "live",
}) {
  const dotColor = status === "warn" ? t.warn : status === "ok" ? t.ok : t.teal;
  return (
    <g>
      <rect x={x} y={y} width={w} height={h} rx={10}
        fill={t.nodeFill}
        stroke={accent ? t.teal : t.border}
        strokeWidth={accent ? 1.4 : 1} />
      <circle cx={x + 14} cy={y + h/2 - 8} r={3.5} fill={dotColor} opacity="0.95">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x={x + 26} y={y + h/2 - 4}
        fontFamily="'Courier New', monospace" fontSize="11" fontWeight="600"
        fill={t.text1} letterSpacing="0.06em">{label}</text>
      {sub && (
        <text x={x + 26} y={y + h/2 + 11}
          fontFamily="'Courier New', monospace" fontSize="9.5"
          fill={t.text2} letterSpacing="0.1em">{sub.toUpperCase()}</text>
      )}
    </g>
  );
}

function FlowEdge({
  d, t, mode, gradId, strokeWidth = 1.6,
  drawDelay = 0, particleDelay = 0, particleColor, particleDur = 3.2,
  particles = 1,
}) {
  const arr = Array.from({ length: particles });
  return (
    <g>
      <path d={d} fill="none" stroke={`url(#${gradId})`} strokeWidth={strokeWidth}
        style={{
          strokeDasharray: 1000, strokeDashoffset: 1000,
          animation: `mwDraw 1.4s ${drawDelay}ms cubic-bezier(.5,0,.2,1) forwards`,
        }} />
      {arr.map((_, i) => (
        <circle key={i} r="3.5" fill={particleColor || t.teal} opacity="0">
          <animateMotion dur={`${particleDur}s`} begin={`${particleDelay + i * particleDur / particles}s`}
            repeatCount="indefinite" path={d} />
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
            dur={`${particleDur}s`} begin={`${particleDelay + i * particleDur / particles}s`}
            repeatCount="indefinite" />
        </circle>
      ))}
    </g>
  );
}

function EdgeDefs({ t, mode }) {
  return (
    <>
      <linearGradient id={`edgeIn-${mode}`} x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stopColor={t.teal} stopOpacity="0.15" />
        <stop offset="100%" stopColor={t.teal} stopOpacity="0.85" />
      </linearGradient>
      <linearGradient id={`edgeOut-${mode}`} x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stopColor={t.teal} stopOpacity="0.85" />
        <stop offset="100%" stopColor={t.teal} stopOpacity="0.15" />
      </linearGradient>
      <linearGradient id={`edgeWarn-${mode}`} x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stopColor={t.warn} stopOpacity="0.2" />
        <stop offset="100%" stopColor={t.warn} stopOpacity="0.85" />
      </linearGradient>
      <radialGradient id={`modelGlow-${mode}`} cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stopColor={t.teal} stopOpacity="0.4" />
        <stop offset="60%" stopColor={t.teal} stopOpacity="0.05" />
        <stop offset="100%" stopColor={t.teal} stopOpacity="0" />
      </radialGradient>
      <radialGradient id={`warnGlow-${mode}`} cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stopColor={t.warn} stopOpacity="0.45" />
        <stop offset="100%" stopColor={t.warn} stopOpacity="0" />
      </radialGradient>
    </>
  );
}

function Crosshairs({ t, w = 1220, h = 560, inset = 12 }) {
  return (
    <>
      {[[inset, inset], [w - inset, inset], [inset, h - inset], [w - inset, h - inset]].map(([x, y], i) => (
        <g key={`c-${i}`} stroke={t.text2} strokeWidth="0.7" opacity="0.35">
          <line x1={x - 6} y1={y} x2={x + 6} y2={y} />
          <line x1={x} y1={y - 6} x2={x} y2={y + 6} />
        </g>
      ))}
    </>
  );
}

/* count-up text node */
function CountUp({ to, dur = 1.5, prefix = "", suffix = "", x, y, ...rest }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, start;
    const animate = (ts) => {
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / (dur * 1000));
      const eased = 1 - Math.pow(1 - p, 3);
      setV(to * eased);
      if (p < 1) raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(raf);
  }, [to, dur]);
  const display = to >= 1000
    ? Math.round(v).toLocaleString()
    : (to % 1 === 0 ? Math.round(v) : v.toFixed(1));
  return <text x={x} y={y} {...rest}>{prefix}{display}{suffix}</text>;
}

/* "x s ago" rolling label */
function AgoTicker({ x, y, ...rest }) {
  const [s, setS] = useState(2);
  useEffect(() => {
    const id = setInterval(() => setS((p) => (p + 1) % 8), 1000);
    return () => clearInterval(id);
  }, []);
  const txt = s === 0 ? "just now" : `${s}s ago`;
  return <text x={x} y={y} {...rest}>last sync: {txt}</text>;
}

Object.assign(window, { NodeCard, FlowEdge, EdgeDefs, Crosshairs, CountUp, AgoTicker });

</script>
<script type="text/babel" data-presets="env,react">
/* === INDUSTRY SCHEMATICS === */
/* Industry hero schematics — 1220 × 560 viewBox.
   Each schematic uses MetricWave's existing visual language:
   - teal accents, monospace tags, dotted ticker eyebrows
   - cards / nodes / flow edges from hero-parts
   - a custom ICONOGRAPHIC focal element appropriate to the industry
*/

/* ============================================================
   Helpers — corner crosshairs (keeps schematic feel consistent)
============================================================ */
function CornerXH({ t, W = 1220, H = 560 }) {
  const pts = [[12,12],[W-12,12],[12,H-12],[W-12,H-12]];
  return (
    <g stroke={t.text2} strokeWidth="0.8" opacity="0.45">
      {pts.map(([x,y], i) => (
        <g key={i}>
          <line x1={x-7} y1={y} x2={x+7} y2={y} />
          <line x1={x} y1={y-7} x2={x} y2={y+7} />
        </g>
      ))}
    </g>
  );
}

function MiniGrid({ t, mode, x, y, w, h, cell = 24 }) {
  const id = `igrid-${mode}-${x}-${y}`;
  return (
    <g opacity="0.35">
      <defs>
        <pattern id={id} width={cell} height={cell} patternUnits="userSpaceOnUse">
          <path d={`M0 0H${cell}M0 0V${cell}`} stroke={t.border} strokeWidth="0.4" />
        </pattern>
      </defs>
      <rect x={x} y={y} width={w} height={h} fill={`url(#${id})`} />
    </g>
  );
}

function Tag({ x, y, label, t, accent = false }) {
  const w = label.length * 6.6 + 18;
  return (
    <g>
      <rect x={x} y={y} width={w} height={18} rx="4"
        fill={accent ? t.teal : t.surface1}
        stroke={accent ? t.teal : t.border} strokeWidth="1" />
      <text x={x + w/2} y={y + 12.5} textAnchor="middle"
        fontFamily="'Courier New', monospace" fontSize="9" fontWeight="700"
        fill={accent ? t.bg : t.text1} letterSpacing="0.12em">{label.toUpperCase()}</text>
    </g>
  );
}

/* ============================================================
   1. LOGISTICS & MOBILITY — Route map with hubs + truck icon
============================================================ */
function SchemLogistics({ t, mode }) {
  const W = 1220, H = 560;
  // Hub positions (city-like nodes connected by routes)
  const hubs = [
    { id: "MTL",  x: 220, y: 174, label: "MONTRÉAL",   sub: "ORIGIN HUB",       primary: true },
    { id: "QC",   x: 460, y: 134, label: "QUÉBEC",     sub: "DROP · 2.4H",      primary: false },
    { id: "TOR",  x: 380, y: 324, label: "TORONTO",    sub: "TRANSIT · 5.1H",   primary: false },
    { id: "OTT",  x: 600, y: 264, label: "OTTAWA",     sub: "DROP · 3.8H",      primary: false },
    { id: "NYC",  x: 820, y: 404, label: "NYC",        sub: "X-BORDER · 7.2H",  primary: false },
    { id: "BOS",  x: 980, y: 244, label: "BOSTON",     sub: "DEST · 6.8H",      primary: false },
  ];
  const routes = [
    ["MTL","QC"], ["MTL","TOR"], ["MTL","OTT"], ["OTT","NYC"], ["TOR","NYC"], ["NYC","BOS"], ["MTL","BOS"]
  ];
  const map = Object.fromEntries(hubs.map(h => [h.id, h]));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" style={{ overflow: "visible" }}>
      <defs><EdgeDefs t={t} mode={mode} /></defs>
      <MiniGrid t={t} mode={mode} x={40} y={40} w={W-80} h={H-80} cell={24} />
      <CornerXH t={t} />

      {/* eyebrow ticker */}
      <text x={60} y={80} fontFamily="'Courier New', monospace" fontSize="10" fontWeight="700"
        fill={t.teal} letterSpacing="0.18em">· FLEET · ROUTING · DISPATCH ·</text>
      <text x={W-60} y={80} textAnchor="end" fontFamily="'Courier New', monospace" fontSize="10"
        fill={t.text2} letterSpacing="0.15em">7 ACTIVE ROUTES · 31% LESS DEADHEAD</text>

      {/* routes */}
      {routes.map(([a, b], i) => {
        const A = map[a], B = map[b];
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2 - 30;
        const d = `M ${A.x} ${A.y} Q ${mx} ${my}, ${B.x} ${B.y}`;
        return (
          <g key={i}>
            <path d={d} fill="none" stroke={t.teal} strokeOpacity="0.35" strokeWidth="1.4"
              strokeDasharray="4 4" />
            {/* moving truck particle */}
            <g opacity="0">
              <rect x="-7" y="-4" width="14" height="8" rx="1" fill={t.teal} />
              <animateMotion dur={`${4 + i * 0.4}s`} begin={`${0.4 + i * 0.5}s`} repeatCount="indefinite" path={d} rotate="auto" />
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1"
                dur={`${4 + i * 0.4}s`} begin={`${0.4 + i * 0.5}s`} repeatCount="indefinite" />
            </g>
          </g>
        );
      })}

      {/* hubs */}
      {hubs.map((h, i) => (
        <g key={h.id} style={{ animation: `mwPop 0.4s ${0.2 + i * 0.08}s backwards` }}>
          {/* outer ping */}
          {h.primary && (
            <circle cx={h.x} cy={h.y} r="22" fill={t.teal} opacity="0.18">
              <animate attributeName="r" values="22;42;22" dur="2.4s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" />
            </circle>
          )}
          <circle cx={h.x} cy={h.y} r={h.primary ? 13 : 9} fill={h.primary ? t.teal : t.bg}
            stroke={t.teal} strokeWidth="2" />
          {h.primary && <circle cx={h.x} cy={h.y} r="4" fill={t.bg} />}

          {/* label box */}
          <g transform={`translate(${h.x + 16}, ${h.y - 24})`}>
            <rect x={0} y={0} width={140} height={36} rx="5"
              fill={t.surface1} stroke={t.border} strokeWidth="1" />
            <text x={9} y={14} fontFamily="'Courier New', monospace" fontSize="10" fontWeight="800"
              fill={t.text1} letterSpacing="0.1em">{h.label}</text>
            <text x={9} y={28} fontFamily="'Courier New', monospace" fontSize="8.5"
              fill={t.teal} letterSpacing="0.12em">{h.sub}</text>
          </g>
        </g>
      ))}

      {/* RIGHT — KPI panel anchored below the route network */}
      <g style={{ animation: "mwSlideInR 0.5s 0.4s backwards" }}>
        <rect x={W - 280} y={424} width={240} height={130} rx="10"
          fill={t.surface1} stroke={t.border} strokeWidth="1" />
        <text x={W - 264} y={449} fontFamily="'Courier New', monospace" fontSize="10" fontWeight="700"
          fill={t.text2} letterSpacing="0.15em">DISPATCH KPIs</text>
        <line x1={W - 264} y1={461} x2={W - 56} y2={461} stroke={t.border} />

        {[
          { label: "ROUTES OPTIMIZED",  val: "1,284" },
          { label: "DEADHEAD KM SAVED", val: "31%"   },
          { label: "ON-TIME RATE",      val: "97.2%" },
          { label: "AVG STOP TIME",     val: "8.4M"  },

    ["n1","s1"], ["n1","s2"], ["n2","s3"], ["n2","s4"], ["n4","s5"], ["n3","s6"],
    ["n1","n2"], ["n3","n5"], ["n4","n5"],
  ];
  const map = Object.fromEntries(nodes.map(n => [n.id, n]));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" style={{ overflow: "visible" }}>
      <defs><EdgeDefs t={t} mode={mode} /></defs>
      <CornerXH t={t} />

      <text x={60} y={80} fontFamily="'Courier New', monospace" fontSize="10" fontWeight="700"
        fill={t.teal} letterSpacing="0.18em">· RESEARCH · COURSEWARE · OPEN-DATA ·</text>
      <text x={W-60} y={80} textAnchor="end" fontFamily="'Courier New', monospace" fontSize="10"
        fill={t.text2} letterSpacing="0.15em">UNIVERSITIES · LABS · NSERC · FRQ</text>

      {/* glow */}
      <circle cx={cx} cy={cy} r="260" fill={`url(#modelGlow-${mode})`} opacity="0.7" />

      {/* edges */}
      {edges.map(([a, b], i) => {
        const A = map[a], B = map[b];
        return (
          <line key={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y}
            stroke={t.teal} strokeOpacity={0.45} strokeWidth="1.2"
            style={{
              strokeDasharray: 200, strokeDashoffset: 200,
              animation: `mwDraw 1.2s ${0.3 + i * 0.05}s cubic-bezier(.5,0,.2,1) forwards`,
            }} />
        );
      })}

      {/* nodes */}
      {nodes.map((n, i) => (
        <g key={n.id} style={{ animation: `mwPop 0.4s ${0.2 + i * 0.04}s backwards` }}>
          {n.primary && (
            <circle cx={n.x} cy={n.y} r={n.r + 8} fill="none" stroke={t.teal} strokeWidth="1"
              opacity="0.4" strokeDasharray="3 4">
              <animateTransform attributeName="transform" type="rotate"
                from={`0 ${n.x} ${n.y}`} to={`360 ${n.x} ${n.y}`} dur="22s" repeatCount="indefinite" />
            </circle>
          )}
          <circle cx={n.x} cy={n.y} r={n.r}
            fill={n.primary ? t.text1 : t.surface1}
            stroke={t.teal} strokeWidth={n.primary ? 2 : 1.2} />
          <text x={n.x} y={n.y + 4} textAnchor="middle"
            fontFamily="'Courier New', monospace"
            fontSize={n.primary ? 12 : n.r >= 30 ? 9.5 : 9} fontWeight="800"
            fill={n.primary ? t.teal : t.text1} letterSpacing="0.10em">{n.label}</text>
        </g>
      ))}

      {/* RIGHT — Research stats */}
      <g style={{ animation: "mwFadeIn 0.6s 0.6s backwards" }}>
        <rect x={780} y={90} width={400} height={140} rx="10"
          fill={t.surface1} stroke={t.border} strokeWidth="1" />
        <text x={804} y={118} fontFamily="'Courier New', monospace" fontSize="10" fontWeight="700"
          fill={t.text2} letterSpacing="0.15em">RESEARCH OUTPUT · 2024</text>
        <g transform="translate(804, 134)">
          {[
            { val: "47",  lbl: "PAPERS"     },
            { val: "12",  lbl: "DATASETS"   },
            { val: "8",   lbl: "WORKSHOPS"  },
          ].map((s, i) => (
            <g key={i} transform={`translate(${i * 120}, 0)`}>
              <text x={0} y={48} fontFamily="'Inter', sans-serif" fontSize="38" fontWeight="900"
                fill={t.teal} letterSpacing="-0.04em">{s.val}</text>
              <text x={0} y={64} fontFamily="'Courier New', monospace" fontSize="9.5" fontWeight="700"
                fill={t.text2} letterSpacing="0.12em">{s.lbl}</text>
            </g>
          ))}
        </g>

        {/* citation graph */}
        <rect x={780} y={244} width={400} height={308} rx="10"
          fill={t.surface1} stroke={t.border} strokeWidth="1" />
        <text x={804} y={272} fontFamily="'Inter', sans-serif" fontSize="14" fontWeight="800"
          fill={t.text1}>CITATIONS · 5-YEAR</text>
        <text x={1156} y={272} textAnchor="end" fontFamily="'Courier New', monospace" fontSize="9.5"
          fill={t.teal} letterSpacing="0.12em">↑ 4.2×</text>

        {(() => {
          const bars = [12, 22, 38, 64, 142];
          const labels = ["'20","'21","'22","'23","'24"];
          const max = 142;
          const BASE = 516;
          return bars.map((v, i) => {
            const h = (v / max) * 220;
            const x = 810 + i * 70;
            const y = BASE - h;
            return (
              <g key={i}>
                <rect x={x} y={y} width={44} height={h}
                  fill={i === bars.length - 1 ? t.teal : t.tealDk}
                  opacity={i === bars.length - 1 ? 1 : 0.55}
                  style={{ transformOrigin: `${x + 22}px ${BASE}px`, animation: `mwBar 0.8s ${0.8 + i * 0.1}s cubic-bezier(.5,0,.2,1) backwards` }} />
                <text x={x + 22} y={y - 5} textAnchor="middle"
                  fontFamily="'Courier New', monospace" fontSize="9.5" fontWeight="800"
                  fill={t.text1}>{v}</text>
                <text x={x + 22} y={534} textAnchor="middle"
                  fontFamily="'Courier New', monospace" fontSize="9.5"
                  fill={t.text2}>{labels[i]}</text>
              </g>
            );
          });
        })()}
      </g>
    </svg>
  );
}

/* ============================================================
   6. NON-PROFIT & NGO — Impact dashboard + global reach map
============================================================ */
function SchemNGO({ t, mode }) {
  const W = 1220, H = 560;

  // Three concentric impact rings (showing funds → programs → beneficiaries)
  const cx = 320, cy = 280;
  const RING_R = 185;
  const layers = [
    { r: 55,       label: "FUNDS",         val: "$8.4M",   color: t.teal },
    { r: 100,      label: "PROGRAMS",      val: "47",      color: t.teal },
    { r: 145,      label: "PARTNERS",      val: "128",     color: t.tealLt },
    { r: RING_R,   label: "BENEFICIARIES", val: "62K",     color: t.tealLt },
  ];

  // Region tags around outer ring
  const regions = [
    { a: -Math.PI * 0.5,             label: "EMEA" },
    { a: -Math.PI * 0.5 + Math.PI/4, label: "WEST AFRICA" },
    { a:  Math.PI * 0.0,             label: "EAST AFRICA" },
    { a:  Math.PI * 0.25,            label: "S. ASIA" },
    { a:  Math.PI * 0.5,             label: "L. AMERICA" },
    { a:  Math.PI * 0.75,            label: "EUROPE" },
    { a:  Math.PI,                   label: "MENA" },
    { a: -Math.PI * 0.75,            label: "PACIFIC" },
  ];

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" style={{ overflow: "visible" }}>
      <defs><EdgeDefs t={t} mode={mode} /></defs>
      <CornerXH t={t} />

      <text x={60} y={80} fontFamily="'Courier New', monospace" fontSize="10" fontWeight="700"
        fill={t.teal} letterSpacing="0.18em">· IMPACT · GRANTS · TRANSPARENCY ·</text>
      <text x={W-60} y={80} textAnchor="end" fontFamily="'Courier New', monospace" fontSize="10"
        fill={t.text2} letterSpacing="0.15em">8 REGIONS · 47 PROGRAMS · 62K LIVES</text>

      <circle cx={cx} cy={cy} r={RING_R + 60} fill={`url(#modelGlow-${mode})`} opacity="0.5" />

      {/* Concentric rings */}
      {[...layers].reverse().map((l, idx) => (
        <g key={l.label} style={{ animation: `mwPop 0.5s ${0.2 + idx * 0.12}s backwards`, transformOrigin: `${cx}px ${cy}px` }}>
          <circle cx={cx} cy={cy} r={l.r}
            fill="none" stroke={l.color} strokeWidth="1.4" opacity="0.85" />
          <circle cx={cx} cy={cy} r={l.r}
            fill={l.color} opacity="0.05" />
        </g>
      ))}

      {/* Center glyph */}
      <g style={{ animation: "mwPop 0.4s 0.7s backwards" }}>
        <circle cx={cx} cy={cy} r="40" fill={t.surface1} stroke={t.teal} strokeWidth="2" />
        <text x={cx} y={cy - 4} textAnchor="middle"
          fontFamily="'Courier New', monospace" fontSize="9" fontWeight="800"
          fill={t.teal} letterSpacing="0.18em">METRIC</text>
        <text x={cx} y={cy + 8} textAnchor="middle"
          fontFamily="'Inter', sans-serif" fontSize="14" fontWeight="900"
          fill={t.text1}>GIVES</text>
        <text x={cx} y={cy + 22} textAnchor="middle"
          fontFamily="'Courier New', monospace" fontSize="7.5" fontWeight="700"
          fill={t.teal} letterSpacing="0.18em">PRO BONO</text>
      </g>

      {/* Bottom stat strip — sits below the ring */}
      <g style={{ animation: "mwSlideUp 0.4s 0.85s backwards" }}>
        <rect x={40} y={475} width={620} height={48} rx="6"
          fill={t.surface1} stroke={t.border} strokeWidth="1" />
        {layers.map((l, i) => (
          <g key={l.label}>
            {i > 0 && (
              <line x1={40 + i * 155} y1={483} x2={40 + i * 155} y2={515}
                stroke={t.border} strokeWidth="1" />
            )}
            <text x={40 + i * 155 + 77} y={491} textAnchor="middle"
              fontFamily="'Courier New', monospace" fontSize="8.5" fontWeight="700"
              fill={t.text2} letterSpacing="0.12em">{l.label}</text>
            <text x={40 + i * 155 + 77} y={513} textAnchor="middle"
              fontFamily="'Inter', sans-serif" fontSize="16" fontWeight="900"
              fill={l.color}>{l.val}</text>
          </g>
        ))}
      </g>

      {/* Region pings on outer ring */}
      {regions.map((r, i) => {
        const x = cx + Math.cos(r.a) * RING_R;
        const y = cy + Math.sin(r.a) * RING_R;
        return (
          <g key={i}>
            <circle cx={x} cy={y} r="5" fill={t.teal}>
              <animate attributeName="opacity" values="1;0.3;1" dur={`${1.6 + i * 0.2}s`} repeatCount="indefinite" />
            </circle>
            <text
              x={x + (Math.cos(r.a) > 0 ? 12 : -12)}
              y={y + 4}
              textAnchor={Math.cos(r.a) > 0 ? "start" : "end"}
              fontFamily="'Courier New', monospace" fontSize="9.5" fontWeight="800"
              fill={t.text1} letterSpacing="0.12em">{r.label}</text>
          </g>
        );
      })}

      {/* RIGHT — Allocation breakdown */}
      <g style={{ animation: "mwSlideInR 0.5s 0.5s backwards" }}>
        <rect x={720} y={90} width={460} height={420} rx="10"
          fill={t.surface1} stroke={t.border} strokeWidth="1" />
        <text x={744} y={120} fontFamily="'Inter', sans-serif" fontSize="14" fontWeight="800"
          fill={t.text1}>FUND ALLOCATION</text>
        <text x={1156} y={120} textAnchor="end"
          fontFamily="'Courier New', monospace" fontSize="9.5" fontWeight="700"
          fill={t.teal} letterSpacing="0.12em">FY 2024</text>
        <line x1={744} y1={134} x2={1156} y2={134} stroke={t.border} />

        {(() => {
          const allocs = [
            { lbl: "DIRECT PROGRAMS",        pct: 78, amount: "$6.55M" },
            { lbl: "RESEARCH & EVALUATION",  pct: 9,  amount: "$760K"  },
            { lbl: "ADMINISTRATION",         pct: 7,  amount: "$590K"  },
            { lbl: "FUNDRAISING",            pct: 4,  amount: "$340K"  },
            { lbl: "RESERVES",               pct: 2,  amount: "$170K"  },
          ];
          return allocs.map((a, i) => {
            const y = 156 + i * 64;
            return (
              <g key={i}>
                <text x={744} y={y + 14} fontFamily="'Inter', sans-serif" fontSize="13" fontWeight="800"
                  fill={t.text1}>{a.lbl}</text>
                <text x={1156} y={y + 14} textAnchor="end"
                  fontFamily="'Inter', sans-serif" fontSize="13" fontWeight="900"
                  fill={t.teal} letterSpacing="-0.01em">{a.amount}</text>

                {/* bar */}
                <rect x={744} y={y + 22} width={412} height={10} rx="5"
                  fill={t.bg} stroke={t.border} strokeWidth="0.8" />
                <rect x={744} y={y + 22} width={412 * a.pct / 100} height={10} rx="5"
                  fill={i === 0 ? t.teal : t.tealDk}
                  opacity={i === 0 ? 1 : 0.7 - i * 0.1}
                  style={{ transformOrigin: "744px center", animation: `mwScaleX 0.8s ${0.6 + i * 0.1}s cubic-bezier(.5,0,.2,1) backwards` }} />
                <text x={744} y={y + 48} fontFamily="'Courier New', monospace" fontSize="9" fontWeight="700"
                  fill={t.text2} letterSpacing="0.12em">{a.pct}% OF BUDGET</text>
              </g>
            );
          });
        })()}
      </g>
    </svg>
  );
}
